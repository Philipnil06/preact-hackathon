<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PREACT Pan / Tilt Control</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #080b10;
      color: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 10%, rgb(28 76 110 / .28), transparent 34%),
        #080b10;
    }
    main { width: min(960px, 100%); }
    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); letter-spacing: .05em; }
    header p { margin: 6px 0 0; color: #9aa8b8; }
    #status {
      border: 1px solid #34404d;
      border-radius: 999px;
      padding: 8px 13px;
      color: #b9c4cf;
      white-space: nowrap;
    }
    #status.connected { border-color: #20c979; color: #74e8ad; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 12px;
    }
    button {
      border: 1px solid #3a4653;
      border-radius: 999px;
      padding: 10px 16px;
      background: #151b23;
      color: #f4f7fb;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: #6e8194; }
    button:disabled { cursor: not-allowed; opacity: .42; }
    #track.active { background: #123f2a; border-color: #27d980; }
    #neutral { border-color: #cf9d36; }
    #disconnect { color: #ffaaa4; }
    #pad {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      border: 1px solid #354354;
      border-radius: 20px;
      background:
        linear-gradient(rgb(255 255 255 / .055) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / .055) 1px, transparent 1px),
        #101620;
      background-size: 10% 10%;
      box-shadow: 0 24px 90px rgb(0 0 0 / .45);
    }
    #pad.armed { cursor: crosshair; border-color: #2bca7c; }
    #pad::before,
    #pad::after {
      content: "";
      position: absolute;
      background: rgb(255 255 255 / .14);
      pointer-events: none;
    }
    #pad::before { left: 50%; top: 0; width: 1px; height: 100%; }
    #pad::after { top: 50%; left: 0; height: 1px; width: 100%; }
    #cursor {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 26px;
      height: 26px;
      border: 3px solid #39df91;
      border-radius: 50%;
      box-shadow: 0 0 24px #39df91;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .axis {
      position: absolute;
      z-index: 2;
      padding: 6px 9px;
      border-radius: 8px;
      background: rgb(5 8 12 / .72);
      color: #b4c0cc;
      font-size: 12px;
      pointer-events: none;
    }
    .axis.x { right: 12px; bottom: 12px; }
    .axis.y { left: 12px; top: 12px; }
    .readout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .value {
      border: 1px solid #293541;
      border-radius: 14px;
      padding: 13px 15px;
      background: #0f141b;
    }
    .value span { display: block; color: #8f9dac; font-size: 12px; }
    .value strong { display: block; margin-top: 3px; font-size: 22px; }
    #message { min-height: 22px; margin: 12px 2px 0; color: #96a4b3; }
    @media (max-width: 640px) {
      body { padding: 14px; }
      header { align-items: start; flex-direction: column; }
      .readout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>PREACT PAN / TILT</h1>
        <p>Mouse X controls S1. Mouse Y controls S3.</p>
      </div>
      <div id="status">Disconnected</div>
    </header>

    <div class="toolbar">
      <button id="connect">Connect Genesis</button>
      <button id="track" disabled>Start mouse tracking</button>
      <button id="neutral" disabled>Neutral 90°</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>

    <section id="pad" aria-label="Pan and tilt tracking pad">
      <div id="cursor" aria-hidden="true"></div>
      <div class="axis y">S3 · Y · 170° ↑ / 10° ↓</div>
      <div class="axis x">S1 · X · 10° ← / 170° →</div>
    </section>

    <div class="readout">
      <div class="value"><span>Pan · S1</span><strong id="pan">90°</strong></div>
      <div class="value"><span>Tilt · S3</span><strong id="tilt">90°</strong></div>
    </div>
    <p id="message">Connect the Genesis Mini, then enable mouse tracking.</p>
  </main>

  <script>
    const MIN_ANGLE = 10;
    const MAX_ANGLE = 170;
    const SEND_INTERVAL_MS = 35;
    const MAX_STEP_DEGREES = 7;

    const connectButton = document.querySelector("#connect");
    const trackButton = document.querySelector("#track");
    const neutralButton = document.querySelector("#neutral");
    const disconnectButton = document.querySelector("#disconnect");
    const pad = document.querySelector("#pad");
    const cursor = document.querySelector("#cursor");
    const panValue = document.querySelector("#pan");
    const tiltValue = document.querySelector("#tilt");
    const status = document.querySelector("#status");
    const message = document.querySelector("#message");

    let port = null;
    let tracking = false;
    let sendQueue = Promise.resolve();
    let lastSentAt = 0;
    let targetPan = 90;
    let targetTilt = 90;
    let lastSentPan = 90;
    let lastSentTilt = 90;

    function setConnected(connected) {
      status.textContent = connected ? "Connected · 115200" : "Disconnected";
      status.classList.toggle("connected", connected);
      connectButton.disabled = connected;
      trackButton.disabled = !connected;
      neutralButton.disabled = !connected;
      disconnectButton.disabled = !connected;
      if (!connected) setTracking(false);
    }

    function setTracking(enabled) {
      tracking = enabled && Boolean(port);
      trackButton.classList.toggle("active", tracking);
      trackButton.textContent = tracking ? "Stop mouse tracking" : "Start mouse tracking";
      pad.classList.toggle("armed", tracking);
      message.textContent = tracking
        ? "Tracking is active. Move the pointer inside the panel."
        : port
          ? "Tracking paused."
          : "Connect the Genesis Mini, then enable mouse tracking.";
    }

    function queueCommands(commands) {
      if (!port?.writable) return Promise.resolve();
      const payload = `${commands.join("\n")}\n`;
      sendQueue = sendQueue
        .catch(() => undefined)
        .then(async () => {
          const writer = port.writable.getWriter();
          try {
            await writer.write(new TextEncoder().encode(payload));
          } finally {
            writer.releaseLock();
          }
        })
        .catch((error) => {
          message.textContent = `Serial write failed: ${error.message}`;
          setTracking(false);
        });
      return sendQueue;
    }

    function setReadout(pan, tilt, xPercent = null, yPercent = null) {
      panValue.textContent = `${pan}°`;
      tiltValue.textContent = `${tilt}°`;
      if (xPercent !== null && yPercent !== null) {
        cursor.style.left = `${xPercent}%`;
        cursor.style.top = `${yPercent}%`;
      }
    }

    async function neutral() {
      setTracking(false);
      targetPan = 90;
      targetTilt = 90;
      lastSentPan = 90;
      lastSentTilt = 90;
      setReadout(90, 90, 50, 50);
      await queueCommands(["S1:90", "S3:90"]);
      message.textContent = "Neutral command sent to S1 and S3.";
    }

    connectButton.addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        message.textContent = "Web Serial is unavailable. Open this page in Chrome or Edge.";
        return;
      }
      try {
        port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
        await port.open({ baudRate: 115200 });
        targetPan = 90;
        targetTilt = 90;
        lastSentPan = 90;
        lastSentTilt = 90;
        setConnected(true);
        message.textContent = "Genesis connected. Enable mouse tracking when ready.";
      } catch (error) {
        port = null;
        setConnected(false);
        message.textContent = `Connection failed: ${error.message}`;
      }
    });

    trackButton.addEventListener("click", () => setTracking(!tracking));
    neutralButton.addEventListener("click", neutral);

    disconnectButton.addEventListener("click", async () => {
      if (!port) return;
      await neutral();
      await sendQueue;
      await port.close();
      port = null;
      setConnected(false);
      message.textContent = "Genesis disconnected after returning to neutral.";
    });

    pad.addEventListener("pointermove", (event) => {
      if (!tracking || !port) return;
      const bounds = pad.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (event.clientX - bounds.left) / bounds.width));
      const y = Math.min(1, Math.max(0, (event.clientY - bounds.top) / bounds.height));
      const pan = Math.round(MIN_ANGLE + x * (MAX_ANGLE - MIN_ANGLE));
      const tilt = Math.round(MAX_ANGLE - y * (MAX_ANGLE - MIN_ANGLE));
      targetPan = pan;
      targetTilt = tilt;
      setReadout(pan, tilt, x * 100, y * 100);
    });

    function stepToward(current, target) {
      const difference = target - current;
      if (Math.abs(difference) <= MAX_STEP_DEGREES) return target;
      return current + Math.sign(difference) * MAX_STEP_DEGREES;
    }

    function controlLoop(now) {
      if (tracking && port && now - lastSentAt >= SEND_INTERVAL_MS) {
        const nextPan = stepToward(lastSentPan, targetPan);
        const nextTilt = stepToward(lastSentTilt, targetTilt);
        const commands = [];

        if (nextPan !== lastSentPan) {
          lastSentPan = nextPan;
          commands.push(`S1:${nextPan}`);
        }
        if (nextTilt !== lastSentTilt) {
          lastSentTilt = nextTilt;
          commands.push(`S3:${nextTilt}`);
        }
        if (commands.length) {
          lastSentAt = now;
          queueCommands(commands);
        }
      }
      requestAnimationFrame(controlLoop);
    }

    window.addEventListener("beforeunload", () => {
      if (port?.writable) queueCommands(["S1:90", "S3:90"]);
    });

    setConnected(false);
    requestAnimationFrame(controlLoop);
  </script>
</body>
</html>
